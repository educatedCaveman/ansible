# install git config file
- name: push ssh config file (root)
  ansible.builtin.copy:
    src:  config_root
    dest:  /root/.ssh/config
    mode:   "0644"

# install key files
- name: push key files (root)
  ansible.builtin.copy:
    src:  "/home/drake/.ssh/{{ item.keyfile }}"
    dest:  "/root/.ssh/{{ item.keyfile }}"
    remote_src: no  #copy from controller
    mode:   "{{ item.mode }}"
  loop:
    - {keyfile: "ansible_forgejo_id_ed25519", mode: "0600"}
    - {keyfile: "ansible_forgejo_id_ed25519.pub", mode: "0644"}

# drake keys:
- name: authorize the keys (root)
  ansible.posix.authorized_key:
    user:   root
    state:  present
    key:    '{{ item }}'
  with_file:
    - /home/drake/.ssh/theseus2_id_ed25519.pub

# known hosts
- name: Add git server keys (root)
  ansible.builtin.known_hosts:
    name: "git.drak3.io"
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 git.drak3.io') }}"

