# Packages
- name: Update packages
  ansible.builtin.apt:
    name: '*'
    state: latest
  when:
    - ansible_facts['pkg_mgr'] == "apt"

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade:  safe
  when:
    - ansible_facts['pkg_mgr'] == "apt"

- name: install packages
  apt:
    name:  
      - htop
      - tree
      - curl
      - nmon
      - ncdu
      - dstat
      - saidar
      - ccze
      - lm-sensors
      - lnav
      - rename
      - pigz
      - git-crypt
      - gpg
      - net-tools
      - sudo
      - lsb-release
      - fastfetch
      - direnv
    state:  latest
  when:
    - ansible_facts['pkg_mgr'] == "apt"

