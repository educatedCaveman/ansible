# configure Kubernetes cluster using k3s
# the is a compliment to the k3s ansible stuff in k3s_lab. it should be run first
- name: configure K3S Cluster Nodes
  hosts:
    - k3s
  roles: 
    - linux_role
  tasks:

    # sudo /usr/local/bin/k3s crictl rmi --prune
    - name: Cleanup
      ansible.builtin.cron:
        name:   k3s cleanup
        job:    /usr/local/bin/k3s crictl rmi --prune
        state:  present
        # user: root  # not setting the username should default to current user, which is root
        hour:   "0"
        minute: "0"   # default
        # day:    "*"   # default
        # weekday:  "*" # default
        # month:  "*"   # default

- name: Manager-Specific Node Configuration
  hosts:
    - k3s_managers
  roles:
  tasks:

    - name: Install helm if not exists
      unarchive:
        src: https://get.helm.sh/helm-v3.15.3-linux-amd64.tar.gz
        dest: /usr/local/bin
        extra_opts: "--strip-components=1"
        owner: root
        group: root
        mode: 0755
        remote_src: true
      args:
        creates: /usr/local/bin/helm    


- name: Worker-Specific Node Configuration
  hosts:
    - k3s_workers
  roles:
    - nfs_base_role
    - nfs_music_role
    - nfs_video_role
    - nfs_docs_role
    - nfs_pics_role
    - nfs_temp_role
  tasks:

    # needed for wireguard VPN function of hotio's rflood
    - name: set the IPv4 sysctl parameter (net.ipv4.conf.all.src_valid_mark=1)
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.src_valid_mark
        value:  '1'
        reload: true
        sysctl_set: true

    # optional for wireguard VPN function of hotio's rflood
    - name: set the IPv6 sysctl parameter (net.ipv6.conf.all.disable_ipv6=1)
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.disable_ipv6
        value:  '1'
        reload: true
        sysctl_set: true


- name: Worker-Specific Node Configuration
  hosts:
    - k3s_data
  vars:
    disks:
      - device:     /dev/nvme0n1
        partition:  /dev/nvme0n1p1
        mount_dir:  /var/lib/longhorn
  tasks:

    # need to format the drive
    - name: check the partitions
      community.general.parted:
        device: "{{ item.device }}"
        unit: MiB
      loop: "{{ disks|flatten(levels=1) }}"

    - name: create partition
      community.general.parted:
        device: "{{ item.device }}"
        number: 1
        label:  gpt
        state:  present
      loop: "{{ disks|flatten(levels=1) }}"

    - name: create filesystem
      community.general.filesystem:
        fstype: ext4
        state:  present
        device: "{{ item.partition }}"
      loop: "{{ disks|flatten(levels=1) }}"

    - name: create the device mount directory
      file:
        path: "{{ item.mount_dir }}"
        state:  directory
        recurse:  yes
      loop: "{{ disks|flatten(levels=1) }}"

    - name: mount the drive
      mount:
        src:  "{{ item.partition }}"
        path: "{{ item.mount_dir }}"
        fstype: ext4
        state:  mounted
      loop: "{{ disks|flatten(levels=1) }}"

    # packages and services for longhorn
    - name: install longhorn prerequisites
      apt:
        name:
          - open-iscsi
          - nfs-common
        state:  latest

    - name: start and enable services
      systemd:
        name:   "{{ item }}.service"
        state:  started
        enabled:  yes
      loop:
        - open-iscsi

        